<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Market Terminal</title>
        <script>
            // Runs before first paint so the saved theme and text direction apply without a flash.
            // Storage keys must match STORAGE_KEYS in src/utils/storage.ts.
            (function applySavedPreferences() {
                var root = document.documentElement;
                var savedTheme = null;
                var savedLocale = null;

                try {
                    savedTheme = localStorage.getItem('market-terminal:theme');
                    savedLocale = localStorage.getItem('market-terminal:locale');
                } catch (error) {
                    savedTheme = null;
                }

                if (savedTheme !== 'light' && savedTheme !== 'dark') {
                    savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }

                root.dataset.theme = savedTheme;

                if (savedLocale === 'fa') {
                    root.lang = 'fa';
                    root.dir = 'rtl';
                }
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
